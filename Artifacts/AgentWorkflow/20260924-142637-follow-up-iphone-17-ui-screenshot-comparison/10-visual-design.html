<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视觉设计对比</title><style>body{font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;max-width:1120px;margin:32px auto;padding:0 20px;color:#172033;background:#f7f8fa}main{background:#fff;padding:28px;border-radius:16px;box-shadow:0 6px 24px #17203312}.compare{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 0 32px}figure{margin:0}img{width:100%;border:1px solid #dfe4ea;border-radius:14px}figcaption{margin:8px 0;font-weight:700}@media(max-width:700px){.compare{grid-template-columns:1fr}}</style></head><body><main><h1>VIS 视觉设计师：设计图 vs 实际 UI</h1><p>参考资产来自 <code>fastlane/screenshots/zh-Hans/iPhone 6.5-inch/</code>；实际资产来自 iPhone 17 Simulator。对比重点是共享风格，不把记分操作页纳入改造。</p><h2>共享视觉结论</h2><ul><li>纸张米白底、深海军蓝标题、橙色强调、浅蓝信息卡均在实际 UI 中保持一致。</li><li>管理页和设置页使用真实系统大标题、分组卡片与底部导航；职业页使用同一套卡片、数字指标和分段选择器。</li><li>发现并修正了 iOS 27 下导航栏背景配置导致大标题变白的问题；最终截图中的标题已恢复为深色。</li></ul><h2>逐项证据</h2><div class="compare"><figure><img src="design-reference/zh-Hans/04-team.png" alt="中文团队设计参考"><figcaption>参考：04-team.png / 团队管理风格</figcaption></figure><figure><img src="screenshots/iphone-17/management.png" alt="实际管理页"><figcaption>实际：iPhone 17 / 管理页</figcaption></figure><figure><img src="design-reference/zh-Hans/05-growth.png" alt="中文成长设计参考"><figcaption>参考：05-growth.png / 成长与指标风格</figcaption></figure><figure><img src="screenshots/iphone-17/career.png" alt="实际职业页"><figcaption>实际：iPhone 17 / 职业页</figcaption></figure><figure><img src="design-reference/zh-Hans/02-stats.png" alt="中文统计设计参考"><figcaption>参考：02-stats.png / 统计与卡片风格</figcaption></figure><figure><img src="screenshots/iphone-17/settings.png" alt="实际设置页"><figcaption>实际：iPhone 17 / 设置页</figcaption></figure></div></main></body></html>
